<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-paint 見本から再描画・試作</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #eff1f4; color: #242738; font: 13px/1.5 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: minmax(400px, 1fr) 300px; height: 100vh; }
      .app-view { position: relative; min-width: 0; }
      iframe { width: 100%; height: 100%; border: 0; background: white; }
      #replay { position: absolute; inset: 50px 35px 35px; background: #e7eaf0; display: none; align-items: center; justify-content: center; }
      #replay img { max-height: 94%; max-width: 94%; height: 90%; object-fit: contain; }
      aside { padding: 18px; overflow-y: auto; border-left: 1px solid #d7dce6; background: #fafbfc; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p { margin: 4px 0 12px; }
      .muted { color: #737c8e; font-size: 12px; }
      #reference { display: block; max-height: 205px; max-width: 100%; margin: 12px auto; border: 1px solid #d5dbe4; }
      button, select, input { font: inherit; }
      button { border: 1px solid #cbd2de; background: white; color: #26324b; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #run { background: #1b737d; border-color: #1b737d; color: white; }
      .row { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
      #progress { width: 100%; accent-color: #247c87; }
      #status { min-height: 44px; margin-top: 8px; overflow-wrap: anywhere; }
      #stages { padding-left: 22px; }
      #stages li { margin: 6px 0; }
      #stages button { width: 100%; text-align: left; }
      #seek { width: 100%; }
      #metrics { font-variant-numeric: tabular-nums; white-space: pre-line; }
      details { margin: 14px 0; }
      input[type=file] { max-width: 100%; font-size: 12px; }
      @media(max-width: 800px) { main { grid-template-columns: minmax(320px,1fr) 250px; } aside { padding: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <section class="app-view">
        <iframe id="paint-app" src="/" title="ai-paint のキャンバス"></iframe>
        <div id="replay"><img id="replay-image" alt="実際に描画した途中経過" /></div>
      </section>
      <aside>
        <h1>見本から再描画</h1>
        <p class="muted">試作 / ローカル画像処理・GPT呼び出しなし</p>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="完成見本を選択" />
        <img id="reference" alt="完成見本" hidden />
        <p id="source-info" class="muted">画像を読み込んでください。</p>
        <div class="row"><button id="run" disabled>再描画を試す</button><button id="stop" disabled>中止</button></div>
        <progress id="progress" value="0" max="100"></progress>
        <div id="status" role="status">キャンバスを準備しています</div>
        <div id="metrics" class="muted"></div>
        <ol id="stages"></ol>
        <div class="row"><button id="play" disabled>工程を再生</button><button id="live" disabled>キャンバスに戻る</button></div>
        <input id="seek" type="range" value="0" min="0" max="0" disabled aria-label="描画の途中経過" />
        <div class="row"><button id="png" disabled>完成PNG</button><button id="bundle" disabled>検証結果を保存</button></div>
        <details><summary>この試作について</summary><p class="muted">画像の輪郭と色を解析し、丸ブラシの操作列へ変換します。描画はai-paintの既存キャンバスと履歴を使います。再生はその実行中に保存した画面です。人物の部位を理解するAgent、画像生成、アプリ標準パネルへの統合はまだ含みません。</p></details>
      </aside>
    </main>
    <script type="module" src="/src/debug/referencePaintExperiment.ts"></script>
  </body>
</html>
